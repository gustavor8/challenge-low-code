version: '3.8'

services:
  argos-armazem:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Use SQLite local no container por padrão.
      # Para PostgreSQL em produção, adicione a DATABASE_URL.
      - DATABASE_URL=sqlite:///./argos_armazem.db
    volumes:
      - ./data:/app/data
    restart: always
